<style>
:root{--ink:#131313;--cr:#f3eee4;--go:#b79b5c;--gd:#8a7038;--mu:#8a8578;--r:16px;--cd:#1e1e1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*,*:before,*:after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--cr);font:400 17px/1.75 'Hind Siliguri',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond','Hind Siliguri',serif;font-weight:600;line-height:1.2;margin:0}
a{color:inherit}.w{max-width:1120px;margin:auto;padding:0 22px}
section{padding:96px 0}.lt{background:var(--cr);color:var(--ink);--cd:#fffdf8}.lt .eb{color:var(--gd)}
.eb{color:var(--go);letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;margin:0}
h2{font-size:clamp(2.1rem,5vw,3.1rem);margin:.2em 0 1em}
.btn{display:inline-flex;align-items:center;gap:.6em;padding:.8em 1.6em;border-radius:999px;border:1px solid var(--go);background:var(--go);color:#171717;font:500 1rem 'Hind Siliguri',sans-serif;cursor:pointer;text-decoration:none;transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #0004}.btn.o{background:none;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--go);outline-offset:3px}
#ld{position:fixed;inset:0;z-index:99;background:var(--ink);display:grid;place-items:center;transition:opacity .6s,visibility .6s}#ld.gone{opacity:0;visibility:hidden}
#ld b{font:600 1.3rem 'Cormorant Garamond',serif;color:var(--go);letter-spacing:.3em;animation:pl 1.1s infinite alternate}#ld b:after{content:"";display:block;height:1px;background:var(--go);margin-top:12px}
@keyframes pl{from{opacity:.25}to{opacity:1}}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#131313eb;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}
.nv{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.lg{font:600 1.45rem 'Cormorant Garamond',serif;text-decoration:none;color:var(--go)}
.lk{display:flex;gap:26px}.lk a{text-decoration:none;font-size:.93rem;opacity:.85;transition:.3s}.lk a:hover{opacity:1;color:var(--go)}
.hr{display:flex;gap:12px;align-items:center}.wb,.wf{display:grid;place-items:center;border-radius:50%;background:#2c9a5a;color:#fff;transition:.3s}.wb{width:42px;height:42px}.wb:hover,.wf:hover{transform:scale(1.08)}
.hb{display:none;flex-direction:column;gap:5px;background:none;border:0;padding:10px;cursor:pointer}.hb i{width:24px;height:2px;background:var(--cr)}
.hero{min-height:calc(100vh - 68px);display:grid;align-items:center;text-align:center;position:relative;padding:80px 0 120px;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#2a2620,transparent 65%)}
.hero:before{content:"\201C";position:absolute;top:1rem;left:4%;font:600 22rem/1 'Cormorant Garamond',serif;color:#b79b5c14}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:28px;height:10px;background:repeating-linear-gradient(90deg,#b79b5c30 0 14px,transparent 14px 28px)}
.hero h1{font-size:clamp(3.2rem,11vw,7rem);margin:.15em 0 .05em}.rl{color:var(--go);font-size:1.15rem;letter-spacing:.12em;margin:0}
.tg{font-size:clamp(1.15rem,2.5vw,1.5rem);max-width:640px;margin:1.4em auto 2em;opacity:.9}.bt{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.sp{margin-top:2.6em;font-size:.82rem;color:var(--mu);letter-spacing:.08em}
.ab{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:center}
.ph{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--ink);display:grid;place-items:center;box-shadow:0 20px 50px #0003}.ph img{width:100%;height:100%;object-fit:cover}.ph span{font:600 5rem 'Cormorant Garamond',serif;color:var(--go)}
.ch span{display:inline-block;padding:.2em .9em;border:1px solid var(--gd);border-radius:999px;margin:0 8px 8px 0;font-size:.88rem}
.st{display:flex;gap:44px;margin-top:22px;flex-wrap:wrap}.st b{display:block;font:600 2.5rem 'Cormorant Garamond',serif;color:var(--gd)}.st span{font-size:.9rem}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px}
.cd{background:var(--cd);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 30px #0002;cursor:pointer;transition:.35s;border:0;padding:0;text-align:left;color:inherit;font:inherit;display:block;width:100%}.cd:hover{transform:translateY(-6px);box-shadow:0 18px 40px #0004}
.cv{aspect-ratio:16/10;background:#262522;display:grid;place-items:center;overflow:hidden}.cv img{width:100%;height:100%;object-fit:cover;transition:.6s}.cd:hover .cv img{transform:scale(1.05)}.mo{font:600 4rem 'Cormorant Garamond',serif;color:var(--go)}
.cb{padding:20px 22px 24px}.cb small,.mp small{color:var(--go);letter-spacing:.14em;text-transform:uppercase;font-size:.75rem}.lt .cb small{color:var(--gd)}.cb h3{font-size:1.5rem;margin:.2em 0 .3em}.cb p{margin:0 0 .6em;font-size:.95rem;opacity:.85}.cb em{font-size:.82rem;color:var(--mu)}
.rc{padding:28px}.rc q{display:block;font:500 1.15rem/1.7 'Hind Siliguri',serif;quotes:none}.rc footer{display:flex;gap:12px;align-items:center;margin-top:18px}.av{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--go);display:grid;place-items:center;overflow:hidden;font-weight:600;flex:none}.av img{width:100%;height:100%;object-fit:cover}.rc small{display:block;color:var(--mu)}
.em{color:var(--mu);grid-column:1/-1}
#of{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:860px}.fl{display:block;font-size:.92rem}.fw{grid-column:1/-1}

.nt{font-size:.85rem;color:var(--mu);margin:0}
.ct{text-align:center}.ct .btn{font-size:1.2rem;padding:1em 2.2em;background:#2c9a5a;border-color:#2c9a5a;color:#fff}.ct p{margin:1.2em 0 .4em}.ct .so{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#ft{text-align:center;padding:36px 22px;color:var(--mu);font-size:.85rem}
.wf{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;z-index:40;box-shadow:0 8px 24px #0006}
#eb{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40}
.ov{position:fixed;inset:0;background:#000c;z-index:90;display:none;overflow:auto}.ov.on{display:block}
.pn{position:relative;background:var(--cr);color:var(--ink);max-width:700px;margin:24px auto;border-radius:20px;padding:28px;box-shadow:0 30px 70px #000a}
.pn h3{font-size:2rem;margin:.2em 0 .5em}.pn small{color:var(--gd)}.mi{width:100%;border-radius:12px;margin-bottom:16px}
.cl{position:absolute;top:10px;right:14px;background:none;border:0;font-size:2rem;cursor:pointer;color:var(--ink)}
.pn input,.pn select,.pn textarea{background:#fff;color:#111;border-color:#0003}
.af{display:block;margin:0 0 14px;font-size:.88rem}.tb,.ft{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tb .btn,.ft .btn{padding:.5em 1.2em}
.it{border:1px solid #0002;border-radius:12px;padding:12px 16px;margin-bottom:12px;background:#fffdf8}.it summary{cursor:pointer;font-weight:500}.ip img{max-width:120px;display:block;margin:6px 0;border-radius:8px}
